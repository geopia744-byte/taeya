<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>뉴스ai자동화</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="titlebar">
  <div class="logo">▶</div>
  <div class="appname">뉴스 AI 자동화</div>
  <div class="pill" id="pill"><span class="dot"></span><span id="pillTx"></span></div>
  <div class="tb-right">
    <button title="작업 목록" onclick="작업목록()">☰</button>
    <button title="새로고침" onclick="location.reload()">⟳</button>
  </div>
</div>

<div class="crumb">
  <a href="#" onclick="작업목록();return false">작업 목록</a>
  <span class="sep" id="crSep" style="display:none">/</span>
  <span class="cur" id="crCur"></span>
  <div style="margin-left:auto;display:flex;gap:7px">
    <button class="btn sm" onclick="새작업()">+ 새 작업</button>
  </div>
</div>

<div class="body">
  <div class="side">
    <div class="lab">제작 순서</div>
    <div class="pipe" id="pipe"><div class="rail"></div></div>
    <div class="foot">뉴스 AI 자동화 · 2차</div>
  </div>
  <div class="main" id="main"></div>
</div>

<div id="toast"></div>
<script src="genres.js"></script>
<script src="styles.js"></script>
<script src="app.js"></script>
</body>
</html>
